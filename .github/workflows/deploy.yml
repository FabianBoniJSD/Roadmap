name: Build and Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      verify_kerberos_renewal:
        description: Invalidate the app ticket cache and verify automatic renewal
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: roadmap-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verified production deployment
    runs-on: [self-hosted, linux, roadmap]
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/source
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Enforce dedicated unprivileged runner
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || {
            echo 'Deployment refuses to run as root.' >&2
            exit 1
          }
          test "$(id -un)" = 'roadmap' || {
            echo 'Deployment runner must use the dedicated roadmap account.' >&2
            exit 1
          }
          umask 077
          printf '%s\n' \
            'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            >> "$GITHUB_ENV"

      - name: Checkout protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.1'

      - name: Enable package manager
        run: |
          set -euo pipefail
          corepack enable
          node --version
          yarn --version
          test "$(node --version)" = 'v26.12.1'
          test "$(yarn --version)" = '1.22.22'

      - name: Reclaim dependency cache space
        run: |
          set -euo pipefail
          cache_dir="$(yarn cache dir)"
          case "$cache_dir" in
            "$HOME"/.cache/yarn/*|"$HOME"/.yarn/*) ;;
            *)
              echo "Refusing to clean unexpected Yarn cache path: $cache_dir" >&2
              exit 1
              ;;
          esac
          yarn cache clean
          rm -rf -- "$RUNNER_TEMP/yarn-cache"
          mkdir -p "$RUNNER_TEMP/yarn-cache"
          df -h "$HOME" "$RUNNER_TEMP"

      - name: Materialize protected runtime configuration
        env:
          BASE_ENV: ${{ secrets.env }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          ENTRA_REDIRECT_URI: ${{ secrets.ENTRA_REDIRECT_URI }}
          ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ secrets.ENTRA_POST_LOGOUT_REDIRECT_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTERNAL_API_BASE_URL: ${{ secrets.INTERNAL_API_BASE_URL }}
          CLAMAV_HOST: ${{ secrets.CLAMAV_HOST }}
          CLAMAV_PORT: ${{ secrets.CLAMAV_PORT }}
          CLAMAV_TIMEOUT_MS: ${{ secrets.CLAMAV_TIMEOUT_MS }}
          PUBLIC_PROJECTS_API_KEYS: ${{ secrets.PUBLIC_PROJECTS_API_KEYS }}
          SP_KERBEROS_SERVICE_USER: ${{ secrets.SP_KERBEROS_SERVICE_USER }}
          SP_KERBEROS_SERVICE_PASSWORD: ${{ secrets.SP_KERBEROS_SERVICE_PASSWORD }}
          SP_PEOPLE_PICKER_SITE_URL: ${{ vars.SP_PEOPLE_PICKER_SITE_URL }}
          SP_PEOPLE_PICKER_INSTANCE_SLUG: ${{ vars.SP_PEOPLE_PICKER_INSTANCE_SLUG }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const overrideKeys = [
            'ENTRA_TENANT_ID',
            'ENTRA_CLIENT_ID',
            'ENTRA_CLIENT_SECRET',
            'ENTRA_REDIRECT_URI',
            'ENTRA_POST_LOGOUT_REDIRECT_URI',
            'JWT_SECRET',
            'INTERNAL_API_SECRET',
            'APP_ORIGIN',
            'DATABASE_URL',
            'INTERNAL_API_BASE_URL',
            'CLAMAV_HOST',
            'CLAMAV_PORT',
            'CLAMAV_TIMEOUT_MS',
            'PUBLIC_PROJECTS_API_KEYS',
            'SP_KERBEROS_SERVICE_USER',
            'SP_KERBEROS_SERVICE_PASSWORD',
            'SP_PEOPLE_PICKER_SITE_URL',
            'SP_PEOPLE_PICKER_INSTANCE_SLUG',
          ];
          const requiredOverrides = [
            'ENTRA_TENANT_ID',
            'ENTRA_CLIENT_ID',
            'ENTRA_CLIENT_SECRET',
            'ENTRA_REDIRECT_URI',
            'JWT_SECRET',
            'INTERNAL_API_SECRET',
            'APP_ORIGIN',
            'DATABASE_URL',
            'INTERNAL_API_BASE_URL',
            'CLAMAV_HOST',
            'SP_KERBEROS_SERVICE_USER',
            'SP_KERBEROS_SERVICE_PASSWORD',
            'SP_PEOPLE_PICKER_SITE_URL',
          ];
          for (const key of requiredOverrides) {
            if (!process.env[key]) throw new Error(`Required production secret is missing: ${key}`);
          }
          if (process.env.JWT_SECRET.length < 32 || process.env.INTERNAL_API_SECRET.length < 32) {
            throw new Error('JWT_SECRET and INTERNAL_API_SECRET must contain at least 32 characters');
          }
          const keyPattern = new RegExp(`^(?:${overrideKeys.join('|')})=`);
          const base = String(process.env.BASE_ENV || '')
            .split(/\r?\n/)
            .filter((line) => !keyPattern.test(line.trim()))
            .join('\n');
          const overrides = overrideKeys
            .filter((key) => process.env[key])
            .map((key) => `${key}=${JSON.stringify(process.env[key])}`)
            .join('\n');
          fs.writeFileSync('.env', `${base}\n${overrides}\n`, { mode: 0o600 });
          NODE
          chmod 600 .env

      - name: Install locked dependencies
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/yarn-cache
        run: yarn install --frozen-lockfile --non-interactive --production=false

      - name: Reject unsafe production configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          require('dotenv').config({ path: '.env' });
          const required = [
            'APP_ORIGIN',
            'DATABASE_URL',
            'ENTRA_REDIRECT_URI',
            'INTERNAL_API_BASE_URL',
            'CLAMAV_HOST',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`Required production setting is missing: ${key}`);
          }
          for (const key of [
            'SP_ALLOW_SELF_SIGNED',
            'SP_TLS_FALLBACK_INSECURE',
            'SP_PROXY_DEBUG',
            'SP_CURL_VERBOSE',
            'ENABLE_SECURITY_DEBUG_ENDPOINTS',
          ]) {
            if (process.env[key] === 'true') throw new Error(`Unsafe production setting: ${key}`);
          }
          if (process.env.NODE_TLS_REJECT_UNAUTHORIZED === '0') {
            throw new Error('TLS certificate verification cannot be disabled');
          }
          const db = new URL(process.env.DATABASE_URL);
          if (!['postgres:', 'postgresql:'].includes(db.protocol)) {
            throw new Error('Production DATABASE_URL must use PostgreSQL');
          }
          if (!db.hostname) {
            throw new Error('Production PostgreSQL requires a database host');
          }
          if (!db.username || !db.password || db.pathname === '/') {
            throw new Error('Production PostgreSQL requires a database, user, and password');
          }
          NODE

      # - name: Verify Kerberos service authentication
      #   run: yarn smoke:kerberos

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          yarn prisma generate

      - name: Align Prisma target schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();

          async function main() {
            const rawUrl = process.env.DATABASE_URL;
            if (/[\r\n]/.test(rawUrl)) {
              throw new Error('DATABASE_URL must not contain line breaks');
            }

            const parsedUrl = new URL(rawUrl);
            let targetSchema = parsedUrl.searchParams.get('schema');
            let normalizedUrl = rawUrl;

            if (!targetSchema) {
              const [connection] = await prisma.$queryRaw`
                SELECT current_schema() AS schema
              `;
              targetSchema = connection?.schema;
              if (!targetSchema) {
                throw new Error('PostgreSQL did not provide a default schema');
              }
              const separator = rawUrl.includes('?') ? '&' : '?';
              normalizedUrl =
                `${rawUrl}${separator}schema=${encodeURIComponent(targetSchema)}`;
            }

            const envLines = fs.readFileSync('.env', 'utf8').split(/\r?\n/);
            let replacements = 0;
            const normalizedEnv = envLines
              .map((line) => {
                if (!/^DATABASE_URL=/.test(line)) return line;
                replacements += 1;
                return `DATABASE_URL=${JSON.stringify(normalizedUrl)}`;
              })
              .join('\n');
            if (replacements !== 1) {
              throw new Error(
                `Expected exactly one DATABASE_URL in .env, found ${replacements}`,
              );
            }

            fs.writeFileSync('.env', normalizedEnv, { mode: 0o600 });
            process.stdout.write(`::add-mask::${normalizedUrl}\n`);
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `DATABASE_URL=${normalizedUrl}\n`,
            );
            console.log(`Prisma database schema: ${targetSchema}`);
          }

          main()
            .finally(() => prisma.$disconnect())
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Inspect PostgreSQL migration access
        run: |
          set -euo pipefail
          node <<'NODE'
          const { Prisma, PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const tablesToInspect = [
            '_prisma_migrations',
            'RoadmapInstance',
            'RoadmapInstanceHost',
            'SuperAdmin',
            'InstanceDepartmentAccess',
            'FeedbackRequest',
            'FeedbackVote',
            'SupportConversation',
            'SupportMessage',
            'RateLimitBucket',
            'AuthSession',
            'AuditEvent',
          ];

          async function main() {
            const [schemaAccess] = await prisma.$queryRaw`
              SELECT
                current_schema() AS schema,
                has_schema_privilege(current_user, current_schema(), 'USAGE') AS can_use,
                has_schema_privilege(current_user, current_schema(), 'CREATE') AS can_create
            `;
            const tableAccess = await prisma.$queryRaw(Prisma.sql`
              SELECT
                tables.tablename,
                tables.tableowner = current_user AS owned_by_deployment_role,
                has_table_privilege(
                  current_user,
                  format('%I.%I', tables.schemaname, tables.tablename),
                  'SELECT'
                ) AS can_select,
                has_table_privilege(
                  current_user,
                  format('%I.%I', tables.schemaname, tables.tablename),
                  'INSERT,UPDATE,DELETE'
                ) AS can_write
              FROM pg_catalog.pg_tables AS tables
              WHERE tables.schemaname = current_schema()
                AND tables.tablename IN (${Prisma.join(tablesToInspect)})
              ORDER BY tables.tablename
            `);

            console.log('PostgreSQL schema access:', schemaAccess);
            console.table(tableAccess);

            const migrations = tableAccess.find(
              ({ tablename }) => tablename === '_prisma_migrations',
            );
            if (migrations && (!migrations.can_select || !migrations.can_write)) {
              throw new Error(
                'The deployment database role cannot manage public._prisma_migrations. ' +
                  'The database owner must grant SELECT, INSERT, UPDATE, and DELETE on that table.',
              );
            }
          }

          main()
            .finally(() => prisma.$disconnect())
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Apply reviewed database migrations
        run: |
          set -euo pipefail
          yarn prisma migrate deploy

      - name: Verify PostgreSQL schema
        run: |
          set -euo pipefail
          node <<'NODE'
          const { Prisma, PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const expected = [
            'RoadmapInstance',
            'RoadmapInstanceHost',
            'SuperAdmin',
            'InstanceDepartmentAccess',
            'FeedbackRequest',
            'FeedbackVote',
            'SupportConversation',
            'SupportMessage',
            'RateLimitBucket',
            'AuthSession',
            'AuditEvent',
          ];

          async function main() {
            const rows = await prisma.$queryRaw(Prisma.sql`
              SELECT tablename
              FROM pg_catalog.pg_tables
              WHERE schemaname = current_schema()
                AND tablename IN (${Prisma.join(expected)})
            `);
            const present = new Set(rows.map(({ tablename }) => tablename));
            const missing = expected.filter((table) => !present.has(table));
            if (missing.length > 0) {
              throw new Error(`PostgreSQL schema is incomplete: ${missing.join(', ')}`);
            }
            console.log(`Verified ${expected.length} PostgreSQL application tables.`);
          }

          main()
            .finally(() => prisma.$disconnect())
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Run verification gates
        run: |
          set -euo pipefail
          yarn tsc --noEmit
          yarn lint --max-warnings 100
          yarn test:security
          yarn audit --groups dependencies --level low

      - name: Build production bundle
        env:
          NODE_ENV: production
        run: yarn build

      - name: Enforce performance budgets
        run: yarn perf:budget

      - name: Restart only the roadmap service
        env:
          NODE_ENV: production
          PORT: '3000'
          # Keep the long-lived PM2 daemon and app outside the Actions job's
          # orphan-process cleanup.
          RUNNER_TRACKING_ID: ''
        run: |
          set -euo pipefail
          test -x node_modules/.bin/pm2 || {
            echo 'Locked PM2 binary is missing.' >&2
            exit 1
          }
          export PM2_HOME="$HOME/.pm2"
          # Load generated .env into the shell environment so PM2 inherits runtime vars
          # (the deploy step writes a secured .env file earlier in the workflow).
          if [ -f .env ]; then
            # Use POSIX-compatible sourcing to export assignments like KEY="value"
            set -a
            # shellcheck disable=SC1090
            . ./.env
            set +a
          fi
          node_modules/.bin/pm2 startOrRestart ecosystem.config.js --only roadmap-app --update-env
          node_modules/.bin/pm2 save

      - name: Verify local readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/health/ready || true)"
            if [ "$code" != '000' ] && [ -n "$code" ]; then
              echo "Roadmap is reachable (HTTP $code)."
              exit 0
            fi
            sleep 5
          done
          echo 'Roadmap failed its local readiness check.' >&2
          exit 1

      - name: Verify SharePoint People Picker
        run: yarn smoke:people-picker

      - name: Invalidate application Kerberos cache for renewal verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_kerberos_renewal }}
        run: |
          set -euo pipefail
          cache_path="$HOME/.cache/roadmap/krb5cc-$(id -u)"
          case "$cache_path" in
            "$HOME"/.cache/roadmap/krb5cc-*) ;;
            *)
              echo 'Refusing to invalidate an unexpected Kerberos cache path.' >&2
              exit 1
              ;;
          esac
          test -f "$cache_path" || {
            echo 'Application Kerberos cache is missing.' >&2
            exit 1
          }
          kdestroy -c "FILE:$cache_path"

      - name: Verify SharePoint contextinfo and Kerberos renewal
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: yarn smoke:contextinfo

      - name: Remove temporary dependency cache
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/yarn-cache"
